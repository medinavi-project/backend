[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["integration: explicitly enabled live Gemini test"]
[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/medicare/*.py" = ["ALL"]
"app/medicare_final/*.py" = ["ALL"]
