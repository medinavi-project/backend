events {}
http {
    upstream medinavi { server 127.0.0.1:8000; }
    server {
        listen 80;
        client_max_body_size 6m;
        proxy_read_timeout 150s;
        location /api/ { proxy_pass http://medinavi; }
        location /docs { proxy_pass http://medinavi; }
        location /openapi.json { proxy_pass http://medinavi; }
        location /health { proxy_pass http://medinavi; }
    }
}
