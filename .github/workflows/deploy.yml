name: Build and deploy to NCP
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ncp-main-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      # Tests are kept local only (backend/tests is git-ignored).
      - name: Run checks
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Set GHCR image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.pull_request.merge_commit_sha || github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          # PR이 닫힌 뒤(merge 이벤트)에는 캐시 쓰기 권한이 없어 실패할 수 있다. 캐시 저장 실패로 배포를 막지 않는다.
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Deploy immutable image over SSH
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          NCP_HOST: 101.79.27.212
          NCP_USER: ${{ secrets.NCP_SSH_USER }}
          NCP_PORT: ${{ secrets.NCP_SSH_PORT }}
          SSH_KEY: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NCP_SSH_KNOWN_HOSTS }}
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$NCP_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          port=${NCP_PORT:-22}
          [[ "$port" =~ ^[0-9]+$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$BACKEND_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ncp_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"; rm -f ~/.ssh/ncp_key' EXIT
          cp deploy/compose.yml deploy/release.sh deploy/Caddyfile "$stage/"
          printf '%s\n' "$BACKEND_ENV" > "$stage/.next-env"
          printf '%s\n' "$DOCKER_USER" > "$stage/.docker-user"
          printf '%s' "$DOCKER_TOKEN" > "$stage/.docker-token"
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" > "$stage/.next-image"
          ssh_opts=(-i ~/.ssh/ncp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" -p "$port" "$NCP_USER@$NCP_HOST" 'umask 077; mkdir -p ~/medinavi; chmod 700 ~/medinavi'
          scp "${ssh_opts[@]}" -P "$port" "$stage/compose.yml" "$stage/release.sh" "$stage/Caddyfile" "$stage/.next-env" "$stage/.next-image" "$stage/.docker-user" "$stage/.docker-token" "$NCP_USER@$NCP_HOST:medinavi/"
          ssh "${ssh_opts[@]}" -p "$port" "$NCP_USER@$NCP_HOST" 'bash ~/medinavi/release.sh'
